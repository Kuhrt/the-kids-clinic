name: tkc-production
services:
  postgres:
    image: postgres:16
    container_name: tkc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tkc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: tkc-cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${CMS_APP_KEYS}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY}
      JWT_SECRET: ${CMS_JWT_SECRET}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
    volumes:
      - cms-uploads:/app/public/uploads
    networks:
      - tkc-net
    expose:
      - "1337"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CMS_API_URL=${NEXT_PUBLIC_CMS_API_URL}
        - NEXT_PUBLIC_CMS_API_KEY=${NEXT_PUBLIC_CMS_API_KEY}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
        - NEXT_PUBLIC_MAPBOX_KEY=${NEXT_PUBLIC_MAPBOX_KEY}
    container_name: tkc-web
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CMS_API_URL: ${NEXT_PUBLIC_CMS_API_URL}
      NEXT_PUBLIC_CMS_API_KEY: ${NEXT_PUBLIC_CMS_API_KEY}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
      NEXT_PUBLIC_MAPBOX_KEY: ${NEXT_PUBLIC_MAPBOX_KEY}
    networks:
      - tkc-net
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: tkc-nginx
    restart: unless-stopped
    depends_on:
      - cms
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - tkc-net

volumes:
  postgres-data:
  cms-uploads:

networks:
  tkc-net:
    driver: bridge
